name: Build, Smoke Test & Profile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Detect Docker-relevant file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'docker/**'
              - 'scripts/**'
              - 'docker-compose.yml'
              - '.github/workflows/build.yml'

      - name: Build image (source changed)
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: reverse-mcp-toolbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: steps.filter.outputs.docker == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        if: steps.filter.outputs.docker == 'false'
        run: |
          echo "Docker files unchanged — pulling from GHCR..."
          if docker pull "ghcr.io/${{ github.repository }}:latest" 2>/dev/null; then
            docker tag "ghcr.io/${{ github.repository }}:latest" reverse-mcp-toolbox:latest
            echo "Pulled and tagged reverse-mcp-toolbox:latest"
          else
            echo "No image on GHCR yet — falling back to build..."
            docker compose build
          fi

      - name: Image size
        run: |
          echo "=== Image size ==="
          docker images reverse-mcp-toolbox --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}'
          SIZE=$(docker images reverse-mcp-toolbox --format '{{.Size}}' | head -1)
          echo "IMAGE_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Copy test fixtures into workspace
        run: |
          mkdir -p workspace/tests/fixtures
          cp tests/fixtures/hello.elf tests/fixtures/HelloWorld.apk workspace/tests/fixtures/

      - name: Smoke test MCP servers
        run: bash scripts/tests/smoke-test.sh --no-build --no-cleanup

      - name: RE tools test (r2, Ghidra, angr)
        run: |
          docker exec toolbox bash /opt/tools/scripts/tests/re-tools-test.sh

      - name: CLI tools test (angr-solve, fuzz-init, ghidra-import)
        run: |
          docker exec toolbox bash /opt/tools/scripts/tests/cli-tools-test.sh

      - name: Component disk usage
        run: |
          echo "=== Component disk usage ==="
          docker exec toolbox bash -c '
          du_comp() {
            local label="$1" path="$2"
            if [ -e "$path" ]; then
              printf "%-35s %8s\n" "$label" "$(du -sh "$path" 2>/dev/null | cut -f1)"
            else
              printf "%-35s %8s\n" "$label" "(absent)"
            fi
          }
          du_comp "Ghidra headless"             /opt/tools/ghidra
          du_comp "radare2 (build+source)"      /opt/tools/radare2
          du_comp "radare2 source tree"         /opt/tools/radare2-src
          du_comp "ghidra-mcp bridge"           /opt/tools/ghidra-mcp
          du_comp "fuzzing (all)"               /opt/tools/fuzzing
          du_comp "Android platform-tools"      /opt/tools/platform-tools
          du_comp "jadx"                        /opt/tools/jadx
          du_comp "apktool"                     /opt/tools/apktool.jar
          du_comp "Python site-packages"        /usr/local/lib/python3*/dist-packages
          du_comp "r2pm plugins"                /home/ctf/.local/share/radare2/r2pm
          du_comp "Ghidra projects volume"      /home/ctf/.config/ghidra
          '

      - name: Memory usage
        run: |
          echo "=== Memory usage ==="
          docker exec toolbox free -h
          echo
          echo "=== Top processes by RSS ==="
          docker exec toolbox ps aux --sort=-%mem | head -12

      - name: Build with Android tools
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: reverse-mcp-toolbox:latest
          build-args: |
            BUILD_ANDROID=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Android tools test (apktool, jadx, frida, objection)
        run: |
          docker compose down 2>/dev/null || true
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/mcp 2>/dev/null | grep -qE "^(406|200)"; then
              echo "Gateway ready after ${i}s"
              break
            fi
            sleep 1
          done
          docker exec toolbox bash /opt/tools/scripts/tests/android-tools-test.sh

      - name: Summary
        run: |
          echo "### CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image source | ${{ steps.filter.outputs.docker == 'true' && 'built' || 'pulled' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image size | ${IMAGE_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: docker compose down 2>/dev/null || true
