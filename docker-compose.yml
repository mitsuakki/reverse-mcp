services:
  toolbox:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_ANGR: ${BUILD_ANGR:-1}
        BUILD_FUZZING: ${BUILD_FUZZING:-0}
        BUILD_ANDROID: ${BUILD_ANDROID:-0}
    container_name: toolbox
    stdin_open: true
    tty: true
    environment:
      - ENABLE_GATEWAY_HTTP=${ENABLE_GATEWAY_HTTP:-1}
      - GATEWAY_HTTP_PORT=${GATEWAY_HTTP_PORT:-3100}
      - GATEWAY_HTTP_HOST=${GATEWAY_HTTP_HOST:-0.0.0.0}
      - GHIDRA_MCP_PORT=${GHIDRA_MCP_PORT:-8089}
      - GHIDRA_MCP_AUTH_TOKEN=${GHIDRA_MCP_AUTH_TOKEN:-reverse-mcp-dev-secret}
      - GHIDRA_MCP_URL=${GHIDRA_MCP_URL:-http://127.0.0.1:8089}
      - GHIDRA_INSTALL_DIR=${GHIDRA_INSTALL_DIR:-/opt/tools/ghidra}
      - GHIDRA_PROJECTS_DIR=${GHIDRA_PROJECTS_DIR:-/home/ctf/ghidra-projects}
      - FUZZING_DIR=${FUZZING_DIR:-/opt/tools/fuzzing}
    ports:
      - "${GATEWAY_HTTP_PORT:-3100}:${GATEWAY_HTTP_PORT:-3100}"   # MCP gateway
    volumes:
      - ./workspace:/workspace
      - ghidra-projects:/home/ctf/.config/ghidra
    cap_add:
      - SYS_PTRACE     # needed for gdb/strace/AFL-related debugging inside the container
    security_opt:
      - seccomp:unconfined

volumes:
  ghidra-projects: